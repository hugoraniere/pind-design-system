import { Accordion as AccordionPrimitive } from "radix-ui"

// Protótipo (Ajustar): card ov-hidden · seções com divider-t · .acc-trigger (py-16 px-20 gap-16) com rótulo (.lbl),

function Accordion({

  variant = "card",
  ...props
}: React.ComponentProps<typeof AccordionPrimitive.Root> & { variant?: "card" | "plain" }) {
  return (

  ...props

      className={cn("border-t border-muted first:border-t-0", className)}
      {...props}
    />
  )
}

  className,
  children,
  ...props
}: React.ComponentProps<typeof AccordionPrimitive.Trigger>) {
  return (
    <AccordionPrimitive.Header className="flex">
      <AccordionPrimitive.Trigger
        data-slot="accordion-trigger"
        className={cn(
          "group/trigger flex w-full flex-1 cursor-pointer items-center gap-4 px-5 py-4 text-left outline-none focus-visible:shadow-ring disabled:pointer-events-none disabled:opacity-45",

          ›
        </span>
      </AccordionPrimitive.Trigger>
    </AccordionPrimitive.Header>
  )
}

// o nome da seção (= .lbl)
function AccordionLabel({ className, ...props }: React.ComponentProps<"div">) {

    <div
      data-slot="accordion-label"
      className={cn("text-xs font-bold tracking-caps text-muted-foreground uppercase", className)}
      {...props}

  )

function AccordionSummary({ className, ...props }: React.ComponentProps<"div">) {
  return (
    <div
      data-slot="accordion-summary"
      className={cn("mt-1 truncate text-base font-bold text-foreground group-data-[state=open]/trigger:hidden", className)}

}

  className,
  children,
  ...props
}: React.ComponentProps<typeof AccordionPrimitive.Content>) {

      className="overflow-hidden"
      {...props}
    >
      <div className={cn("px-5 pb-5", className)}>{children}</div>

}

      {...props}

      {children && (

  children,
  errors,
  ...props
}: React.ComponentProps<"div"> & {

}) {
  const content = useMemo(() => {
    if (children) {
      return children
    }

    if (!errors?.length) {
      return null
    }

    const uniqueErrors = [
      ...new Map(errors.map((error) => [error?.message, error])).values(),
    ]

    if (uniqueErrors?.length == 1) {
      return uniqueErrors[0]?.message
    }

    return (

            error?.message && <li key={index}>{error.message}</li>

    )
  }, [children, errors])

    return null
  }

rea clicável maior (padding), nunca com desenho maior."],referencias:[{fonte:"WCAG 2.2, critério 2.5.8 (AA)",valor:"24 x 24 px no mínimo"},{fonte:"WCAG 2.2, critério 2.5.5 (AAA)",valor:"44 x 44 px"},{fonte:"Apple Human Interface Guidelines",valor:"44 x 44 pt"},{fonte:"Material Design 3",valor:"48 x 48 dp"},{fonte:"shadcn/ui",valor:"controles de 36 a 40 no computador; Drawer no lugar de Dialog no celular"}],shadcn_celular:["Dialog no computador vira Drawer (folha que sobe da base) no celular. Ponto de corte: 768px.","Painel lateral é Sheet no computador e folha de tela cheia ou Drawer no celular.","Menu de ações longo no celular vira lista dentro de um Drawer, com itens de 48.","A biblioteca usa o hook `useIsMobile` do shadcn (ponto de corte 768) para escolher a variação."]},Bz={regras:[{regra:"Texto normal tem contraste de 4,5:1 com o fundo. Texto grande (a partir de 24px, ou 19px em negrito) e ícone essencial, 3:1. Use só os pares da tabela de contraste.",base:"WCAG 1.4.3, 1.4.11"},{regra:"O contorno que identifica um controle (borda de campo) tem 3:1 com o fundo.",base:"WCAG 1.4.11"},{regra:"Cor nunca é a única pista. Erro e sucesso levam ícone ou texto, seleção leva borda de 2px.",base:"WCAG 1.4.1"},{regra:"Alvo de toque e de clique segue a tabela de alvos por dispositivo.",base:"WCAG 2.5.8"},{regra:"Foco sempre visível: anel de 2px em brand.500 mais o halo sh-ring. Nunca remova o contorno sem substituir.",base:"WCAG 2.4.7"},{regra:"Tudo é operável por teclado (Tab, Shift+Tab, Enter, Espaço, Esc). O foco nunca fica preso. Ao fechar menu ou cartão, o foco volta ao gatilho.",base:"WCAG 2.1.1, 2.1.2"},{regra:"Todo controle tem nome acessível. Botão só com ícone leva aria-label.",base:"WCAG 4.1.2"},{regra:'Carregando e sucesso são anunciados com role="status" (aria-live polite). Erro usa role="alert" junto do campo.',base:"WCAG 4.1.3"},{regra:"Erro identifica o campo e diz como corrigir, em texto.",base:"WCAG 3.3.1, 3.3.3, Nielsen 9"},{regra:"Movimento respeita prefe
