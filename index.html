import { cn } from "@/lib/utils"

// Aviso em bloco: raio 12 · borda 1 · padding 16/20 · ícone 20 à esquerda · fundo de tint por papel.
// O registro usa grid com coluna arbitrária; aqui o ícone é absoluto e o texto ganha recuo (sem valor arbitrário).
const alertVariants = cva(
  "relative flex w-full flex-col gap-1 rounded-lg border px-5 py-4 text-base has-[>svg]:pl-12 [&>svg]:absolute [&>svg]:top-4 [&>svg]:left-5 [&>svg]:size-5",
  {
    variants: {
      variant: {
        default: "border-border bg-card text-card-foreground [&>svg]:text-primary",
        info: "border-accent-border bg-accent text-foreground [&>svg]:text-primary",
        success: "border-success-subtle-border bg-success-subtle text-foreground [&>svg]:text-success-subtle-foreground",

      },
    },
    defaultVariants: {
      variant: "default",
    },
  }

const PAPEL = { default: "status", info: "status", success: "status", warning: "alert", destructive: "alert" } as const

  className,
  variant,
  ...props
}: React.ComponentProps<"div"> & VariantProps<typeof alertVariants>) {
  return (
    <div
      data-slot="alert"
      data-variant={variant ?? "default"}
      role={PAPEL[variant ?? "default"]}
      className={cn(alertVariants({ variant }), className)}
      {...props}
    />
  )
}

function AlertTitle({ className, ...props }: React.ComponentProps<"div">) {
  return (
    <div
      data-slot="alert-title"
      className={cn("font-bold tracking-tight", className)}
      {...props}
    />
  )
}

function AlertDescription({
  className,
  ...props
}: React.ComponentProps<"div">) {
  return (
    <div
      data-slot="alert-description"
      className={cn("flex flex-col gap-1 text-foreground-secondary [&_p]:text-base", className)}
      {...props}
    />
  )
}

export { Alert, AlertTitle, AlertDescription, alertVariants }

:1. Use só os pares da tabela de contraste.",base:"WCAG 1.4.3, 1.4.11"},{regra:"O contorno que identifica um controle (borda de campo) tem 3:1 com o fundo.",base:"WCAG 1.4.11"},{regra:"Cor nunca é a única pista. Erro e sucesso levam ícone ou texto, seleção leva borda de 2px.",base:"WCAG 1.4.1"},{regra:"Alvo de toque e de clique segue a tabela de alvos por dispositivo.",base:"WCAG 2.5.8"},{regra:"Foco sempre visível: anel de 2px em brand.500 mais o halo sh-ring. Nunca remova o contorno sem substituir.",base:"WCAG 2.4.7"},{regra:"Tudo é operável por teclado (Tab, Shift+Tab, Enter, Espaço, Esc). O foco nunca fica preso. Ao fechar menu ou cartão, o foco volta ao gatilho.",base:"WCAG 2.1.1, 2.1.2"},{regra:"Todo controle tem nome acessível. Botão só com ícone leva aria-label.",base:"WCAG 4.1.2"},{regra:'Carregando e sucesso são anunciados com role="status" (aria-live polite). Erro usa role="alert" junto do campo.',base:"WCAG 4.1.3"},{regra:"Erro identifica o campo e diz como corrigir, em texto.",base:"WCAG 3.3.1, 3.3.3, Nielsen 9"},{regra:"Movimento respeita prefers-reduced-motion. O spinner desacelera e as transições viram nulas.",base:"WCAG 2.3.3"},{regra:"Conteúdo reflui até 200% de zoom e 320px de largura sem perder informação.",base:"WCAG 1.4.4, 1.4.10"},{regra:"O idioma da página é pt-BR.",base:"WCAG 3.1.1"}],cartao:["O cartão de curtir vive no site de outra pessoa: o foco não vaza nem prende o leitor.","Não roube o foco ao carregar. Entrada e saída do foco são previsíveis.",'O gatilho tem nome acessível ("Curtir este conteúdo") e anuncia o estado (curtido).','O convite para criar conta é anunciado com aria-live polite e "Agora não" é alcançável por teclado e por Esc.'],estados:[{estado:"Carregando",fazer:'Texto visível e role="status". Nada de espera sem mensagem.'},{estado:"Erro",fazer:'Texto junto do campo com role="alert", cor danger.500 e ícone. Diz como corrigir.'},{estado:"Sucesso",fazer:'Texto com role="status" e success.700. Some sozinho só se a informação não for necessária depois.'},{estado:"Desabilitado",fazer:"aria-disabled ou disabled, neutral.400, sem foco por Tab quando disabled."},{estado:"Vazio",fazer:"Texto que explica o que vai aparecer e a ação para chegar lá."}],checklist:["Todos os pares de texto e fundo da tela estão na tabela de contraste.","Todo alvo tem a área mínima do dispositivo.","Só com teclado: dá para percorrer, ativar e sair de tudo.","O foco aparece em todo controle e volta ao gatilho ao fechar.","Carregando, erro e sucesso têm texto e aria.","Nenhuma informação depende só da cor.","Com 200% de zoom nada se perde.","Testado com VoiceOver ou NVDA nos fluxos-chave."],telas:['Entrar com Google: é o único caminho de login. O botão tem nome acessível completo ("Entrar com o Google"), não só o logotipo. Carregando e erro em texto.','Instalar o código: o código fica em campo de texto selecionável, com botão "Copiar" e retorno anunciado ("Código copiado"). O passo a passo é uma lista numerada (ol), não só visual.','Convite para criar conta: anunciado com aria-live polite, sem interromper a leitura. "Agora não" sempre alcançável.']},W3={dinheiro:{formato:"R$ 0,00",regra:"Símbolo, espaço, número com duas casas depois da vírgula e ponto de milhar. Vale para qualquer valor, inclusive zero.",certo:["R$ 0,00","R$ 2,00","R$ 14,50","R$ 1.250,00"],errado:["R$ 2","R$2,00","R$ 2,0","2 reais","R$ 14.5","R$ 2,-"],js:"new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(2)",nota_js:"O resultado usa espaço sem quebra entre R$ e o número. Em texto fixo de tela, escreva R$ 2,00 com espaço normal."},regras:[{regra:"Dinheiro sempre no formato R$ 0,00. Valor em coluna alinha à direita com dígitos tabulares (tnum).",base:"Consistência (Nielsen 4)"},{regra:"Números: ponto de milhar e vírgula decimal (1.250). Porcentagem sem espaço (5%).",base:"Consistência (Nielsen 4)"},{regra:'Data curta 01/10/2026. Com mês por extenso, 1 de outubro de 2026. Hora 14h30. Tempo relativo "há 3 dias".',base:"Linguagem do usuário (Nielsen 2)"},{regra:'Botão diz o que acontece: verbo no infinitivo mais objeto ("Copiar código", "Criar conta com o Google"). A mesma ação tem o mesmo nome em toda tela.',base:"Consistência (Nielsen 4)"},{regra:'A marca é feminina: "a Pind". A unidade é masculina: "um Pind", "seus Pinds".',base:"Marca (00-produto/marca-e-tom-de-voz.md)"},{regra:"Erro diz o que houve e como corrigir, junto do campo, sem culpar e sem pedir desculpa.",base:"Ajuda com erros (Nielsen 9)"},{regra:"Carregando, vazio e sucesso têm texto próprio. A pessoa sempre sabe o que está acontecendo.",base:"Visibilidade do estado (Nielsen 1)"},{regra:"Antes de uma ação irreversível, diga o que vai acontecer e ofereça sair.",base:"Prevenção de erros (Nielsen 5)"},{regra:'Sem texto de bastidor visível ("entra quando a gente gravar") nem placeholder de produção.',base:"Honestidade (princípios do produto)"},{regra:"Frases curtas, voz ativa, sem travessão.",base:"Tom de voz"}],mensagens:[{tipo:"Erro de campo",modelo:"O que houve + como corrigir",exemplo:"Esse endereço não abriu. Confira se começa com https://."},{tipo:"Vazio",modelo:"O que aparece aqui + ação para chegar lá",exemplo:"Nenhuma curtida ainda. Quando alguém curtir um texto, aparece aqui."},{tipo:"Carregando",modelo:"Verbo no gerúndio + objeto",exemplo:"Procurando o código no seu site…"},{tipo:"Sucesso",modelo:"O que aconteceu, no passado",exemplo:"Código copiado."},{tipo:"Confirmação",modelo:"O que vai acontecer + saída",exemplo:"Sair da conta? Você volta a entrar com o Google quando quiser."}],nielsen:[{n:1,nome:"Visibilidade do estado do sistema",aplicacao:"Todo estado (carregando, salvo, erro) tem texto e role."},{n:2,nome:"Correspondência com o mundo real",aplicacao:"Linguagem da pessoa, formatos brasileiros."},{n:3,nome:"Controle e liberdade",aplicacao:"Sempre há como voltar, pular ou desfazer."},{n:4,nome:"Consistência e padrões",aplicacao:"Mesma ação, mesmo nome e mesmo componente em todas as telas."},{n:5,nome:"Prevenção de erros",aplicacao:"Confirmação antes do irreversível; campo com formato guiado."},{n:6,nome:"Reconhecimento em vez de memória",aplicacao:"Opções visíveis, rótulo no campo, não só placeholder."},{n:7,nome:"Flexibilidade e eficiência",aplicacao:"Atalho de teclado e ação direta onde cabe."},{n:8,nome:"Estética e design minimalista",aplicacao:"Uma ação primária por tela, três níveis de texto."},{n:9,nome:"Ajuda a reconhecer e corrigir erros",aplicacao:"Erro em texto simples que diz como corrigir."},{n:10,nome:"Ajuda e documentação",aplicacao:"Dica no ponto da dúvida, não em manual separado."}]},ez={cor:Y3,espaco:X3,proibido:Q3,regras:K3,contraste:Z3,alvo:J3,acessibilidade:$3,conteudo:W3},tz=`*{box-sizing:border-box}
@keyframes gira{to{transform:rotate(360deg)}}
:host{display:block;position:relative;margin:0;font-family:Figtree,system-ui,sans-serif;line-height:24px;color:#16151A;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#6C4CF1;text-decoration:none}
a:hover{color:#573BD0}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-feature-settings:"tnum"}
.card{background:#FFFFFF;border:1px solid #E5E2EC;border-radius:16px}
.lbl{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#716D80}
.btn{border:0;border-radius:12px;padding:0 24px;height:48px;font:700 16px/24px Figtree,system-ui,sans-serif;cursor:pointer;
     display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.btn-p{background:#6C4CF1;color:#FFFFFF;box-shadow:0 2px 10px rgba(108,76,241,.28)}
.btn-p:hover{background:#573BD0;box-shadow:0 4px 16px rgba(108,76,241,.36)}
.btn-s{background:#FFFFFF;color:#16151A;border:1px solid #E5E2EC}
.btn-s:hover{border-color:#6C4CF1;color:#6C4CF1}
.btn-g{background:#F6F5F9;color:#16151A}
.btn-g:hover{background:#F0EEF5}
.btn-danger{background:#C93B3B;color:#FFFFFF}
.btn-danger:hover{background:#B93A3A}
.in{border:1px solid #8F8B9C;border-radius:12px;padding:0 16px;height:56px;width:100%;display:flex;align-items:center;font:400 16px/24px Figtree,system-ui,sans-serif;color:#16151A;background:#FFFFFF;outline:none;box-sizing:border-box}
.in::placeholder{color:#716D80}
.in-ph{color:#716D80}
.in:focus{border-color:#6C4CF1;box-shadow:0 0 0 4px rgba(108,76,241,.12)}
.in-area{height:auto;min-height:96px;padding:16px;align-items:flex-start;resize:none}
.in-edit{width:100%;box-sizing:border-box;border:2px solid #6C4CF1;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:16px;line-height:24px;color:#16151A;background:#FFFFFF;outline:none}
.in-group{display:flex;align-items:center;gap:8px;width:100%;height:56px;border:1px solid #8F8B9C;border-radius:12px;padding:0 16px;background:#FFFFFF;box-sizing:border-box;font:400 16px/24px Figtree,system-ui,sans-serif;color:#16151A}
.in-group:focus-within{border-color:#6C4CF1;box-shadow:0 0 0 4px rgba(108,76,241,.12)}
.in-group-input{flex:1;min-width:0;border:0;background:none;outline:none;padding:0;font:inherit;color:inherit}
.in-group-input::placeholder{color:#716D80}
.in-group-addon{flex:none;display:flex;align-items:center;gap:8px;font:400 16px/24px Figtree,system-ui,sans-serif;color:#716D80}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid #F0EEF5;border-top-color:#6C4CF1;animation:gira 1s linear infinite}
.prose p{font-size:16px;line-height:28px;color:#3A362E;margin:0 0 16px}
.prose-sm p{margin:0 0 12px}
.link-row{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:opacity .15s}
.link-row:hover{opacity:.72}
.chip{border-radius:8px;padding:0 12px;display:inline-flex;align-items:center;font:600 16px/24px Figtree,system-ui,sans-serif;cursor:pointer;
      border:1px solid #E5E2EC;background:#FFFFFF;color:#5A5666;transition:all .15s;min-height:40px}
.chip-md{min-height:48px;padding:0 16px}
.chip:hover{border-color:#C4BCE8}
